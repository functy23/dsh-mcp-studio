# Bundle patch layer for the official CLI install:
#
#   dsh plugin --profile desktop add dsh-mcp-studio@latest
#   dsh plugin --profile web     add dsh-mcp-studio@latest
#
# `dsh plugin add` reconciles `dsh.profile.bundles` against installed packages and,
# seeing the `dsh.bundle.patch` declaration in package.json, appends
# `dsh-mcp-studio` to the bundle stack. The profile boot then merges THIS patch (a
# single `insert` of the plugin row) — no profile file edits are needed.
#
# Double-mount guard: if a legacy loader row or an aggregate bundle already mounts
# this plugin under another entry id, two mounts would both register the
# `/dsh-mcp-studio/api` prefix route and fail the whole plugin tree at boot
# ("duplicate prefix route"). The `!!js` expression below backs THIS row off when
# another *enabled* entry already mounts the plugin.
#
# ORDER MATTERS — do not move `!e.disabled` ahead of the id/name checks.
# `Entry.disabled` is an uncached getter that re-evaluates this very expression,
# so touching `e.disabled` of our own row re-enters the expression (infinite
# recursion). The `id !==` check short-circuits on our own row and the `name`
# check short-circuits on every unrelated entry.
- insert:
    - id: dsh-mcp-studio
      name: 'dsh-mcp-studio'
      disabled: !!js "[...ctx.loader.entries()].some((e) => e.options.id !== 'dsh-mcp-studio' && (e.options.name === 'dsh-mcp-studio' || e.options.name === '@dsh/mcp-studio') && !e.disabled)"
